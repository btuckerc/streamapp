<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>StreamApp Chat</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f1f5ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.chat{height:100vh;display:flex;flex-direction:column;background:transparent;border-left:1px solid rgba(170,190,220,.55);text-shadow:0 2px 4px #000}.head{padding:18px;border-bottom:1px solid rgba(170,190,220,.45);font-size:18px;letter-spacing:.04em}.messages{flex:1;min-height:0;overflow:hidden;padding:16px}.message{margin:0 0 16px;font-size:20px;line-height:1.35;overflow-wrap:anywhere}.name{font-weight:700;color:#a8d8ff}.body{color:#fff}.command .body{color:#d1edff}.response{display:block;padding-left:16px;color:#d0f4dc}.footer{padding:12px 16px;font-size:12px;color:#c7d5ec;border-top:1px solid rgba(170,190,220,.45)}.empty{color:#d6e2f7;font-size:17px;line-height:1.5}
</style></head><body><main class="chat"><header class="head"># chat</header><section class="messages" id="messages"><p class="empty" id="empty">Waiting for chat…</p></section><footer class="footer" id="status">CONNECTING</footer></main>
<script>
'use strict';
const box=document.getElementById('messages');
const status=document.getElementById('status');
let lastStatus='';
window.setStatus = value => { const next=String(value).slice(0,100); if(next!==lastStatus){ lastStatus=next; status.textContent=next; } };
window.render = m => {
 if(!m || typeof m !== 'object')return;
 document.getElementById('empty')?.remove();
 const d=document.createElement('article');d.className='message'+(m.is_command?' command':'');
 const n=document.createElement('span');n.className='name';
 const user=m.user&&typeof m.user==='object'?m.user:{};
 if(/^#[0-9a-f]{6}$/i.test(user.color||''))n.style.color=user.color;
 n.textContent='['+String(user.display_name||user.username||m.author||'viewer').slice(0,100)+'] ';
 const b=document.createElement('span');b.className='body';b.textContent=String(m.content||m.text||'').slice(0,2000);d.append(n,b);
 if(m.is_command&&m.response){const r=document.createElement('span');r.className='response';r.textContent='↳ '+String(m.response).slice(0,2000);d.append(r)}
 box.append(d);while(box.children.length>100)box.firstChild.remove();box.scrollTop=box.scrollHeight;
};
</script></body></html>
